<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DualPay Calculator</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#12002f">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkR1YWxQYXkgQ2FsY3VsYXRvciIsCiAgInNob3J0X25hbWUiIjogIkR1YWxQYXkiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzEyMDAyZiIsCiAgInRoZW1lX2NvbG9yIjogIiMxMjAwMmYiCn0=">

    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --fixed-rate: 1.95583;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #2e026d 0%, #12002f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            color: #fff;
        }

        .font-comfortaa { font-family: 'Comfortaa', cursive; }

        /* Динамичен фон */
        .bg-pattern {
            position: fixed;
            top: 0; left: 0; width: 200%; height: 200%;
            z-index: -1;
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40 0l34.64 20v40L40 80 5.36 60V20z' fill='none' stroke='%23888' stroke-width='1'/%3E%3Ctext x='35' y='45' fill='%23888' font-size='10'%3E€%3C/text%3E%3C/svg%3E");
            animation: float 50s linear infinite;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            50% { transform: translate(-5%, -5%) rotate(5deg) scale(1.05); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .neon-border {
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.3);
            border: 1px solid rgba(34, 211, 238, 0.5);
        }

        .neon-text-cyan { color: #22d3ee; text-shadow: 0 0 8px rgba(34, 211, 238, 0.6); }

        .input-focus:focus {
            outline: none;
            border-color: #22d3ee;
            box-shadow: 0 0 12px rgba(34, 211, 238, 0.4);
        }

        .segmented-btn.active {
            background: #22d3ee;
            color: #12002f;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.5);
        }

        #result-box {
            transition: all 0.5s ease;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }

        #result-box.visible {
            max-height: 400px;
            opacity: 1;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>

    <main class="w-full max-w-md px-4 py-6">
        <div class="glass-panel rounded-[2.5rem] p-6 relative">
            
            <div class="flex flex-col items-center mb-8">
                <div class="w-16 h-16 bg-cyan-400 rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(34,211,238,0.6)] transform rotate-3 relative mb-3">
                    <svg viewBox="0 0 100 100" class="w-10 h-10">
                        <polygon points="50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5" fill="none" stroke="#12002f" stroke-width="4"/>
                        <path d="M55,20 L35,50 L55,50 L45,80" stroke="#12002f" stroke-width="5" fill="none" stroke-linecap="round"/>
                        <text x="15" y="45" font-size="12" font-weight="bold" fill="#12002f">лв</text>
                        <text x="70" y="45" font-size="12" font-weight="bold" fill="#12002f">€</text>
                    </svg>
                </div>
                <h1 class="font-comfortaa text-2xl font-bold tracking-tight neon-text-cyan">DualPay</h1>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="text-[10px] uppercase tracking-widest text-cyan-400 font-bold ml-2 mb-1 block">Сума за плащане</label>
                    <div class="flex gap-2">
                        <input type="number" id="billAmount" step="0.01" placeholder="0.00" 
                               class="flex-1 bg-[#f5f3ff] text-indigo-950 h-14 rounded-2xl px-4 text-xl font-bold input-focus transition-all">
                        <select id="billCurrency" class="w-24 bg-slate-900 border border-slate-700 rounded-2xl px-2 font-bold text-cyan-400 outline-none cursor-pointer">
                            <option value="BGN">BGN</option>
                            <option value="EUR">EUR</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-slate-400 font-bold ml-2 mb-1 block">Платено в лв</label>
                        <input type="number" id="paidBGN" step="0.01" placeholder="0.00" 
                               class="w-full bg-slate-900/50 border border-slate-700 h-12 rounded-xl px-3 text-white font-semibold input-focus transition-all">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-slate-400 font-bold ml-2 mb-1 block">Платено в €</label>
                        <input type="number" id="paidEUR" step="0.01" placeholder="0.00" 
                               class="w-full bg-slate-900/50 border border-slate-700 h-12 rounded-xl px-3 text-white font-semibold input-focus transition-all">
                    </div>
                </div>

                <div id="error-box" class="hidden bg-red-500/20 border border-red-500/50 text-red-200 text-xs p-3 rounded-xl text-center animate-pulse">
                    Сумата не е достатъчна!
                </div>

                <div id="result-box">
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Ресто в:</span>
                            <div class="flex bg-slate-950 p-1 rounded-xl">
                                <button onclick="setResultCurrency('BGN')" id="btn-BGN" class="segmented-btn active px-4 py-1 rounded-lg text-xs font-bold transition-all">BGN</button>
                                <button onclick="setResultCurrency('EUR')" id="btn-EUR" class="segmented-btn px-4 py-1 rounded-lg text-xs font-bold transition-all">EUR</button>
                            </div>
                        </div>
                        
                        <div class="neon-border rounded-3xl p-6 text-center bg-cyan-400/5 relative overflow-hidden">
                            <div class="text-[10px] uppercase text-cyan-400 opacity-70 mb-1 font-bold">Дължимо ресто</div>
                            <div id="displayMain" class="text-4xl font-bold neon-text-cyan mb-1">0.00 лв</div>
                            <div id="displaySub" class="text-sm text-slate-400 font-medium">0.00 €</div>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="mt-8 pt-6 border-t border-white/5 text-center">
                <p class="text-[10px] text-slate-500 mb-1">Курс: 1 EUR = 1.95583 BGN</p>
                <p class="text-[10px] font-comfortaa text-cyan-400/60">Теодора Бахчеванска © DualPay Calculator</p>
            </footer>
        </div>
    </main>

    <script>
        const RATE = 1.95583;
        let selectedChangeCurrency = 'BGN';

        const inputs = ['billAmount', 'billCurrency', 'paidBGN', 'paidEUR'];
        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', calculate);
        });

        function setResultCurrency(curr) {
            selectedChangeCurrency = curr;
            document.getElementById('btn-BGN').classList.toggle('active', curr === 'BGN');
            document.getElementById('btn-EUR').classList.toggle('active', curr === 'EUR');
            calculate();
        }

        function calculate() {
            const bill = parseFloat(document.getElementById('billAmount').value) || 0;
            const bCurrency = document.getElementById('billCurrency').value;
            const pBGN = parseFloat(document.getElementById('paidBGN').value) || 0;
            const pEUR = parseFloat(document.getElementById('paidEUR').value) || 0;

            const billInBGN = bCurrency === 'EUR' ? bill * RATE : bill;
            const totalPaidInBGN = pBGN + (pEUR * RATE);
            const changeInBGN = totalPaidInBGN - billInBGN;

            const resultBox = document.getElementById('result-box');
            const errorBox = document.getElementById('error-box');

            if (bill > 0 && totalPaidInBGN > 0) {
                if (changeInBGN < -0.01) {
                    errorBox.classList.remove('hidden');
                    resultBox.classList.remove('visible');
                } else {
                    errorBox.classList.add('hidden');
                    resultBox.classList.add('visible');
                    updateDisplay(changeInBGN);
                }
            } else {
                resultBox.classList.remove('visible');
                errorBox.classList.add('hidden');
            }
        }

        function updateDisplay(bgn) {
            const main = document.getElementById('displayMain');
            const sub = document.getElementById('displaySub');

            if (selectedChangeCurrency === 'BGN') {
                main.innerText = bgn.toFixed(2) + ' лв';
                sub.innerText = (bgn / RATE).toFixed(2) + ' €';
            } else {
                const eur = bgn / RATE;
                main.innerText = eur.toFixed(2) + ' €';
                sub.innerText = bgn.toFixed(2) + ' лв';
            }
        }

        // PWA Service Worker (Inline)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
        }
    </script>
</body>
</html>
